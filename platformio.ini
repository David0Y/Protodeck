[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
upload_protocol = stlink         ; keep in mind which upload protocol youre using, if you have a different one, change it here
;upload_flags = -d 0483:df11

;comment out which main file you want to use, the other ones will be ignored by the build system
;build_src_filter = -<*> +<crisscross_main.cpp>  ; change the test mainfile here ; for crisscross_main.cpp
;build_src_filter = -<*> +<first_test_main.cpp>  ; for first_test_main.cpp
;build_src_filter = -<*> +<crisscross_2_main.cpp> ; for crisscross_2_main.cpp
build_src_filter = -<*> +<full_output_main.cpp> ; for full_output_main.cpp
;build_src_filter = -<*> +<full_input_main.cpp> ; for full_input_main.cpp
;build_src_filter = -<*> +<full_io_main.cpp> ; for full_io_main.cpp